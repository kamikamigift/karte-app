<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="送付管理">
<meta name="theme-color" content="#0071E3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>予約送付書類管理表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --surface2:#F5F5F7;
  --surface3:#E8E8ED;
  --border:#E8E8ED;--border2:#D2D2D7;
  --text1:#1D1D1F;--text2:#515154;--text3:#86868B;
  --accent:#0071E3;--accent2:#0077ED;--accent-bg:#F0F7FF;
  --green:#34C759;--green-bg:#E9F9EE;
  --orange:#FF9500;--orange-bg:#FFF4E5;
  --radius:18px;--radius-sm:12px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.04);
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-md:0 8px 32px rgba(0,0,0,.10);
}
html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}

/* ── Header ── */
.header{background:linear-gradient(135deg,#0071E3,#3395F0);padding:0 max(28px,calc((100vw - 1000px)/2));height:70px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 10px rgba(0,90,180,.28)}
/* 「リソリューション（小）＋タイトル（大）」の2行構成だと大きいタイトルがブロック下側に来て、右のボタンより低く見える。少し上げて視覚的な高さを揃える */
.logo-wrap{display:flex;flex-direction:column;justify-content:center;transform:translateY(-2px)}
.logo{font-size:23px;font-weight:700;color:#fff;letter-spacing:-.022em;line-height:1.1;white-space:nowrap}
.logo-sub{font-size:12.5px;color:rgba(255,255,255,.72);letter-spacing:.06em;margin-bottom:1px;font-weight:500;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:10px}
.icon-btn{height:38px;width:38px;border:none;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.28)}
.btn-primary{height:42px;padding:0 20px;border:none;border-radius:980px;background:#fff;color:var(--accent);font-size:16px;font-family:inherit;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .18s;white-space:nowrap}
.btn-primary:hover{background:#EAF4FF}

/* ── Toolbar ── */
.toolbar{padding:40px max(28px,calc((100vw - 1000px)/2)) 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:220px;position:relative}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-input{width:100%;height:54px;border:none;border-radius:14px;padding:0 16px 0 48px;font-size:18px;font-family:inherit;background:var(--surface);color:var(--text1);outline:none;transition:box-shadow .2s;box-shadow:var(--shadow-sm)}
.search-input:focus{box-shadow:0 0 0 4px rgba(0,113,227,.18)}
.search-input::placeholder{color:var(--text3)}
.sort-btn{height:54px;padding:0 20px;border:none;border-radius:14px;background:var(--surface);color:var(--text2);font-size:16px;font-family:inherit;cursor:pointer;transition:box-shadow .15s;box-shadow:var(--shadow-sm);font-weight:500}
.sort-btn:hover{box-shadow:var(--shadow)}

/* ── Stats / filter chips ── */
.tag-filters{padding:6px max(28px,calc((100vw - 1000px)/2)) 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag-filter{height:36px;padding:0 17px;border-radius:980px;border:none;background:transparent;font-size:15px;font-weight:500;font-family:inherit;color:var(--text2);cursor:pointer;transition:all .15s}
.tag-filter:hover{background:var(--surface3)}
.tag-filter.active{background:var(--text1);color:#fff}
.stat-spacer{flex:1}
.stat{font-size:14.5px;color:var(--text3)}

/* ── Cards ── */
.rec-list{padding:0 max(28px,calc((100vw - 1000px)/2)) 100px;display:flex;flex-direction:column;gap:10px}
.rec-card{background:var(--surface);border:none;border-radius:var(--radius);padding:16px 28px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .22s cubic-bezier(.2,.7,.3,1);box-shadow:var(--shadow-sm)}
.rec-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.rec-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0;background:var(--accent-bg);color:var(--accent)}
.rec-info{flex:1;min-width:0}
.rec-name{font-size:19.5px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.014em;color:var(--text1)}
.rec-name mark{background:rgba(0,113,227,.14);color:var(--text1);border-radius:3px;padding:0 2px}
.rec-sub{font-size:15px;color:var(--text3);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rec-sub .no{font-variant-numeric:tabular-nums}
.rec-badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:220px}
.badge{display:inline-flex;align-items:center;height:27px;padding:0 12px;border-radius:980px;font-size:13px;font-weight:600;letter-spacing:.01em;gap:4px}
.badge.done{background:var(--green-bg);color:#1E8E3E}
.badge.wait{background:var(--surface3);color:var(--text3)}
.badge.method{background:var(--accent-bg);color:var(--accent)}
.empty{text-align:center;padding:90px 20px;color:var(--text3)}
.empty svg{opacity:.5}
.empty p{font-size:16.5px;margin-top:14px}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal-overlay.open{display:flex}
@media(min-width:640px){.modal-overlay{align-items:center}}
.modal-box{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:680px;max-height:94vh;overflow-y:auto;padding:28px 28px 40px;animation:rise .3s cubic-bezier(.2,.7,.3,1)}
@media(min-width:640px){.modal-box{border-radius:24px;padding:34px 36px 40px}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;position:sticky;top:-28px;background:var(--surface);padding-top:6px;z-index:5}
@media(min-width:640px){.modal-header{top:-34px}}
.modal-title{font-size:22px;font-weight:700;letter-spacing:-.022em}
.modal-close{width:34px;height:34px;border:none;background:var(--surface2);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:17px;transition:background .15s;flex-shrink:0}
.modal-close:hover{background:var(--surface3)}

/* ── Section ── */
.section{margin-bottom:26px}
.section-title{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:.02em;margin-bottom:14px;padding-bottom:8px;border-bottom:1.5px solid var(--surface3);display:flex;align-items:center;gap:7px}

/* ── Forms ── */
.form-field{margin-bottom:16px}
.form-label{display:block;font-size:16px;font-weight:600;color:var(--text2);margin-bottom:8px;letter-spacing:.01em}
.form-input,.form-select,.form-textarea{width:100%;min-width:0;border:none;border-radius:12px;padding:14px 16px;font-size:18px;font-family:inherit;color:var(--text1);background:var(--surface2);outline:none;transition:all .18s;line-height:1.5}
/* iOSで日付/時刻/文字入力の高さが揃わずガタつくのを防ぐ：高さを固定 */
.form-input,.form-select{height:54px;padding-top:0;padding-bottom:0;line-height:normal}
/* iOSのネイティブ日付/時刻入力は枠を独自サイズ・値を中央寄せで描画するため、通常のテキスト欄と同じ描画に統一（お名前欄と同じ枠サイズ・左寄せに揃える） */
input[type=date].form-input,input[type=time].form-input{-webkit-appearance:none;-moz-appearance:none;appearance:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{background:var(--surface);box-shadow:0 0 0 4px rgba(0,113,227,.18)}
.form-input::placeholder,.form-textarea::placeholder{color:var(--text3)}
.form-textarea{resize:vertical;min-height:80px}
/* すべての欄をお名前欄と同じ全幅に統一（PC・スマホ共通で1列に）。日付入力の中央寄せズレ対策も兼ねる。
   縦間隔は各form-fieldのmargin-bottomで統一するためgapは0（旧2列名残の14px差をなくす） */
.form-row,.form-row-3{display:grid;grid-template-columns:1fr;gap:0}
/* ラベルが1行/2行で高さが違っても、入力欄を下そろえにしてガタつきを防ぐ */
.form-row .form-field,.form-row-3 .form-field{display:flex;flex-direction:column}
.form-row .form-field>:last-child,.form-row-3 .form-field>:last-child{margin-top:auto;flex-shrink:0}
.inline-note{width:100%;border:none;border-bottom:1.5px solid var(--surface3);background:transparent;padding:5px 2px;font-size:16px;font-family:inherit;color:var(--text1);outline:none}
.inline-note:focus{border-color:var(--accent)}

/* ── Method segmented ── */
.seg{display:flex;gap:8px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;height:54px;border-radius:12px;background:var(--surface2);font-size:17px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;border:1.5px solid transparent}
.seg input:checked+span{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}

/* ── Checklist ── */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;border-radius:12px;transition:background .15s;cursor:pointer;margin-bottom:4px}
.check-item:hover{background:var(--surface2)}
.check-item.on{background:var(--accent-bg)}
.check-box{width:26px;height:26px;border-radius:8px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px;background:var(--surface)}
.check-item.on .check-box{background:var(--accent);border-color:var(--accent)}
.check-box svg{opacity:0;transition:opacity .15s}
.check-item.on .check-box svg{opacity:1}
.check-body{flex:1;min-width:0}
.check-label{font-size:17px;color:var(--text1);font-weight:500}
.check-note{font-size:14px;color:var(--text3);margin-top:3px}
.sub-check{display:inline-flex;align-items:center;gap:6px;margin-left:14px;font-size:14.5px;color:var(--text2);cursor:pointer;padding:3px 10px;border-radius:980px;background:var(--surface);border:1.5px solid var(--surface3);transition:all .15s;vertical-align:middle}
.sub-check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check-inline-input{margin-top:6px}

/* ── Toukan block ── */
.toukan-block{background:var(--surface2);border-radius:14px;padding:16px}

/* ── Actions ── */
.form-actions{display:flex;gap:12px;margin-top:30px;position:sticky;bottom:0;background:var(--surface);padding:14px 0 4px}
.btn-cancel{flex:1;height:54px;border:none;border-radius:980px;background:var(--surface2);font-size:14.5px;font-family:inherit;color:var(--text2);cursor:pointer;transition:background .15s;font-weight:500}
.btn-cancel:hover{background:var(--surface3)}
.btn-save{flex:2;height:54px;border:none;border-radius:980px;background:var(--accent);font-size:18px;font-family:inherit;color:#fff;font-weight:600;cursor:pointer;transition:background .18s}
.btn-save:hover{background:var(--accent2)}
.btn-delete{width:54px;height:54px;border:none;border-radius:980px;background:var(--surface2);color:#FF3B30;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.btn-delete:hover{background:#FFE5E3}
/* 削除は誤タップ防止のため、保存・キャンセルから離して一番下に小さく置く */
.btn-delete-link{display:block;margin:20px auto 6px;background:none;border:none;color:#FF3B30;font-family:inherit;font-size:14px;font-weight:500;padding:8px 14px;cursor:pointer;border-radius:10px;transition:background .15s}
.btn-delete-link:hover{background:#FFE5E3}

/* ── Menu ── */
.menu-overlay{display:none;position:fixed;inset:0;z-index:150}
.menu-overlay.open{display:block}
.menu{position:absolute;top:60px;right:max(28px,calc((100vw - 1000px)/2));background:var(--surface);border-radius:16px;box-shadow:var(--shadow-md);padding:8px;min-width:210px;animation:rise .2s cubic-bezier(.2,.7,.3,1)}
.menu-item{display:flex;align-items:center;gap:11px;padding:14px 15px;border-radius:10px;font-size:16px;color:var(--text1);cursor:pointer;transition:background .12s;font-weight:500}
.menu-item:hover{background:var(--surface2)}
.menu-item svg{color:var(--text3)}
.menu-sep{height:1px;background:var(--surface3);margin:6px 8px}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text1);color:#fff;padding:15px 26px;border-radius:980px;font-size:16px;font-weight:500;z-index:400;opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hint{font-size:13.5px;color:var(--text3);margin-top:6px;line-height:1.5}

/* ── 項目の追加・編集 ── */
.edit-items-link{margin-top:8px;background:none;border:1.5px dashed var(--border2);color:var(--text1);font-family:inherit;font-size:15px;font-weight:600;padding:11px 14px;border-radius:12px;width:100%;cursor:pointer;transition:background .15s}
.edit-items-link:hover{background:var(--accent-bg)}
.item-edit-row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.item-edit-label{flex:1}
.item-del-btn{width:48px;height:48px;flex-shrink:0;border:none;border-radius:12px;background:var(--surface2);color:#FF3B30;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.item-del-btn:hover{background:#FFE5E3}
.add-item-btn{margin-top:4px;width:100%;background:var(--accent-bg);border:none;color:var(--accent);font-family:inherit;font-size:16px;font-weight:600;padding:14px;border-radius:12px;cursor:pointer;transition:background .15s}
.add-item-btn:hover{background:#E1EFFF}

/* ── スマホ向け微調整 ── */
@media(max-width:480px){
  .header{padding-left:16px;padding-right:12px}
  .logo{font-size:19px}
  .logo-sub{font-size:11px}
  .btn-primary{height:40px;padding:0 15px;font-size:15px}
  .icon-btn{height:36px;width:36px}
  .header-right{gap:8px}
  .rec-card{padding:15px 22px;gap:12px;flex-wrap:wrap}
  .rec-avatar{width:42px;height:42px;font-size:15px}
  .rec-name{font-size:16.5px}
  /* タブ4つ（すべて/未発送/発送済/返送済）を1行に収める。件数は右下へ回す */
  .tag-filter{padding:0 12px}
  .stat{margin-left:auto}
  /* バッジは名前の下の段へ回し、名前に横幅を使わせる */
  .rec-badges{flex-basis:100%;max-width:none;margin-left:0;margin-top:2px;justify-content:flex-start;gap:6px}
  .badge{height:24px;padding:0 10px;font-size:12px}
  /* 長いチェック項目（例：リソリューション規約（お客様控え））がiPhoneで2行に折り返すのを防ぐため、少し縮める */
  .check-item{padding:11px 10px;gap:10px}
  .check-label{font-size:15px}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo-wrap">
    <div class="logo-sub">リソリューション</div>
    <div class="logo">予約送付書類管理アプリ</div>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="menuBtn" title="メニュー" aria-label="メニュー">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>
    </button>
    <button class="btn-primary" id="newBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      新規
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="text" class="search-input" id="search" placeholder="お名前・予約No.で検索">
  </div>
  <button class="sort-btn" id="sortBtn">予約日 ↓</button>
</div>

<div class="tag-filters" id="filters">
  <button class="tag-filter active" data-filter="all">すべて</button>
  <button class="tag-filter" data-filter="not_sent">未発送</button>
  <button class="tag-filter" data-filter="sent">発送済</button>
  <button class="tag-filter" data-filter="done">返送済</button>
  <div class="stat-spacer"></div>
  <span class="stat" id="count"></span>
</div>

<div class="rec-list" id="list"></div>

<!-- ── Form Modal ── -->
<div class="modal-overlay" id="formOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="formTitle">新規登録</div>
      <button class="modal-close" id="formClose">✕</button>
    </div>
    <form id="recForm" autocomplete="off">
      <input type="hidden" id="f_id">

      <!-- お客様情報 -->
      <div class="section" style="padding-top:16px">
        <div class="section-title">お客様情報</div>
        <div class="form-field">
          <label class="form-label">お名前</label>
          <input type="text" class="form-input" id="f_name" placeholder="山田 花子">
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">フリガナ</label>
            <input type="text" class="form-input" id="f_kana" placeholder="ヤマダ ハナコ">
          </div>
          <div class="form-field">
            <label class="form-label">予約No.</label>
            <input type="text" class="form-input" id="f_yoyakuNo" placeholder="番号を入力">
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">住所</label>
          <input type="text" class="form-input" id="f_zip" placeholder="〒 000-0000" style="margin-bottom:10px">
          <input type="text" class="form-input" id="f_address" placeholder="住所">
        </div>
        <div class="form-field">
          <label class="form-label">TEL</label>
          <input type="tel" class="form-input" id="f_tel" placeholder="000-0000-0000">
        </div>
      </div>

      <!-- ご予約内容・担当 -->
      <div class="section" style="padding-top:16px">
        <div class="section-title">ご予約内容・担当</div>
        <div class="form-field">
          <label class="form-label">ご予約内容</label>
          <textarea class="form-textarea" id="f_yoyakuNaiyou" placeholder="ご予約の内容" style="min-height:54px;height:54px"></textarea>
        </div>
        <div class="form-field">
          <label class="form-label">担当儀師（当日）</label>
          <input type="text" class="form-input" id="f_gishi" placeholder="担当儀師">
        </div>
      </div>

      <!-- 日程 -->
      <div class="section" style="padding-top:16px">
        <div class="section-title">日程・リソリューション方法</div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">入力日</label>
            <input type="date" class="form-input" id="f_kinyuubi">
          </div>
          <div class="form-field">
            <label class="form-label">入力者</label>
            <input type="text" class="form-input" id="f_kinyuusha" placeholder="担当者名">
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">予約受付日</label>
            <input type="date" class="form-input" id="f_uketsukebi">
          </div>
          <div class="form-field">
            <label class="form-label">予約日</label>
            <input type="date" class="form-input" id="f_yoyakubi">
          </div>

      <!-- 郵送物（1回目・発送時） -->
      <div class="section" style="padding-top:16px">

      <div class="section" style="padding-top:16px">
        <div class="section-title">郵送物（2回目・返送時）</div>
        <div class="form-field">
          <label class="form-label">発送日</label>
          <input type="date" class="form-input" id="f_housoubi2">
          <div class="hint">お客様控えを送る発送日。お客様に届いて完了です。</div>
        </div>
        <div id="retList"></div>
        <button type="button" class="edit-items-link">＋ 項目を追加・編集</button>

      <!-- 最終確認 -->
      <div class="section" style="padding-top:16px">
        <div class="section-title">最終確認</div>
        <div class="form-field" style="margin-bottom:0">
          <label class="form-label">書類最終確認者</label>
          <input type="text" class="form-input" id="f_saishu" placeholder="確認者名">

      <!-- 備考 -->

        <div class="section-title">備考</div>

<div class="modal-overlay" id="itemsOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">郵送物の項目を編集</div>
      <button class="modal-close" id="itemsClose">✕</button>
    </div>
    <p class="hint" style="margin-bottom:22px;font-size:14.5px">項目の追加・名前の変更・削除ができます。ここで変えた内容は、これから開くすべての記録に反映されます。</p>

      <div class="section-title">郵送物（1回目・発送時）</div>

<!-- ── スマホと同期 設定モーダル ── -->
<div class="modal-overlay" id="syncOverlay">
  <div class="modal-box" style="max-width:560px">
    <div class="modal-header">
      <div class="modal-title">データを同期</div>
      <button class="modal-close" id="syncClose">✕</button>
    </div>
    <div id="syncPane"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const STORE_KEY = "soufu_records_v1";
const $ = s => document.querySelector(s);

/* 郵送物の項目・初期値（紙の管理表そのまま）。ユーザーが編集できる */
const DEFAULT_SEND_ITEMS = [
  {id:"aisatsu",  label:"ご挨拶ハガキ", note:"手紙・文章"},
  {id:"eikyou",   label:"影響一例", input:"eikyouNote", inputPh:"内容"},
  {id:"ichiran",  label:"リソリューション一覧用紙"},
  {id:"kiyaku",   label:"リソリューション規約"},
  {id:"meisaiRei",label:"契約明細書（記入例）"},
  {id:"meisai",   label:"契約明細書", note:"お客様用1枚 / 会社用1枚 / 複写シート"},
  {id:"henshinFuutou", label:"返信用封筒 1通", sub:"henshinKitte", subLabel:"切手"},
];
const DEFAULT_RET_ITEMS = [
  {id:"kanryouHagaki", label:"リソリューション完了ハガキ"},
  {id:"meisaiHikae",   label:"契約明細書（お客様控え）"},
  {id:"kiyakuHikae",   label:"リソリューション規約（お客様控え）"},
  {id:"yousouFuutou",  label:"郵送封筒", sub:"yousouKitte", subLabel:"切手"},
];
const ITEMS_KEY = "soufu_items_v1";
function loadItems(){
  try{ const s=JSON.parse(localStorage.getItem(ITEMS_KEY)); if(s && Array.isArray(s.send) && Array.isArray(s.ret)) return s; }catch(e){}
  return { send: DEFAULT_SEND_ITEMS.map(x=>Object.assign({},x)), ret: DEFAULT_RET_ITEMS.map(x=>Object.assign({},x)) };
}
function persistItems(){ localStorage.setItem(ITEMS_KEY, JSON.stringify(itemLists)); }
let itemLists = loadItems();

let records = load();
let currentFilter = "all";
let sortKey = "yoyakubi"; // yoyakubi | updated
let searchTerm = "";

function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(records)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 2000);
}

/* ── 表示用ヘルパ ── */
function fmtMD(d){ if(!d) return ""; const p=d.split("-"); return p.length===3 ? `${+p[1]}/${+p[2]}` : d; }
function initials(name){
  if(!name) return "?";
  return name.trim().charAt(0);
}
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hl(text, term){
  const e = esc(text);
  if(!term) return e;
  try{ return e.replace(new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"), "<mark>$1</mark>"); }
  catch(_){ return e; }
}

/* ── リスト描画 ── */
function render(){
  const list = $("#list");
  let items = records.slice();

  // filter
  items = items.filter(r=>{
    if(currentFilter==="not_sent") return !r.housoubi;
    if(currentFilter==="sent")     return !!r.housoubi && !r.housoubi2;
    if(currentFilter==="done")     return !!r.housoubi2;
    return true;
  });
  // search
  const term = searchTerm.trim();
  if(term){
    const t = term.toLowerCase();
    items = items.filter(r =>
      (r.name||"").toLowerCase().includes(t) ||
      (r.kana||"").toLowerCase().includes(t) ||
      (r.yoyakuNo||"").toLowerCase().includes(t)
    );
  }
  // sort
  items.sort((a,b)=>{
    if(sortKey==="updated") return (b.updatedAt||0)-(a.updatedAt||0);
    return (b.yoyakubi||"").localeCompare(a.yoyakubi||"");
  });

  $("#count").textContent = records.length ? `全 ${records.length} 件` : "";

  if(!items.length){
    list.innerHTML = `<div class="empty">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M9 3h6l1 3H8l1-3zM5 6h14l-1 15H6L5 6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <p>${records.length ? "該当する記録がありません" : "まだ記録がありません。「＋新規」から追加できます"}</p>
    </div>`;
    return;
  }

  list.innerHTML = items.map(r=>{
    const badges = [];
    if(r.method) badges.push(`<span class="badge method">${esc(r.method)}</span>`);
    badges.push(r.housoubi ? `<span class="badge done">発送① ${fmtMD(r.housoubi)}</span>` : `<span class="badge wait">未発送</span>`);
    if(r.housoubi2) badges.push(`<span class="badge done">発送② ${fmtMD(r.housoubi2)}</span>`);
    const sub = [];
    if(r.yoyakubi) sub.push(`予約 ${fmtMD(r.yoyakubi)}${r.yoyakuTime?" "+r.yoyakuTime:""}`);
    if(r.yoyakuNo) sub.push(`<span class="no">${esc(r.yoyakuNo)}</span>`);
    return `<div class="rec-card" data-id="${r.id}">
      <div class="rec-info">
        <div class="rec-name">${hl(r.name || "（名前未入力）", term)}${r.name ? " 様" : ""}</div>
        <div class="rec-sub">${sub.join("<span>·</span>") || "&nbsp;"}</div>
      </div>
      <div class="rec-badges">${badges.join("")}</div>
    </div>`;
  }).join("");

  list.querySelectorAll(".rec-card").forEach(c=>{
    c.addEventListener("click", ()=> openForm(c.dataset.id));
  });
}

/* ── チェックリスト描画 ── */
function checkSvg(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function buildChecklist(container, defs){
  container.innerHTML = defs.map(it=>{
    const noteHtml = it.note ? `<div class="check-note">${esc(it.note)}</div>` : "";
    const subHtml = it.sub ? `<span class="sub-check" data-sub="${it.sub}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(it.subLabel)}</span>` : "";
    const inputHtml = it.input ? `<input type="text" class="inline-note check-inline-input" data-note="${it.input}" placeholder="${esc(it.inputPh||"")}">` : "";
    return `<div class="check-item" data-key="${it.id}">
      <div class="check-box">${checkSvg()}</div>
      <div class="check-body">
        <div class="check-label">${esc(it.label)} ${subHtml}</div>
        ${noteHtml}
        ${inputHtml}
      </div>
    </div>`;
  }).join("");

  // toggle main
  container.querySelectorAll(".check-item").forEach(item=>{
    item.addEventListener("click", e=>{
      if(e.target.closest(".sub-check") || e.target.closest(".check-inline-input")) return;
      item.classList.toggle("on");
    });
  });
  // toggle sub (切手)
  container.querySelectorAll(".sub-check").forEach(sc=>{
    sc.addEventListener("click", e=>{ e.stopPropagation(); sc.classList.toggle("on"); });
  });
}

/* ── フォーム開閉 ── */
function openForm(id){
  const rec = id ? records.find(r=>r.id===id) : null;
  $("#formTitle").textContent = rec ? "追加・編集" : "新規登録";
  $("#deleteBtn").style.display = rec ? "block" : "none";
  $("#recForm").reset();
  buildChecklist($("#sendList"), itemLists.send);
  buildChecklist($("#retList"), itemLists.ret);

  $("#f_id").value = rec ? rec.id : "";
  if(rec){
    setVal("f_name",rec.name); setVal("f_kana",rec.kana); setVal("f_yoyakuNo",rec.yoyakuNo);
    setVal("f_zip",rec.zip); setVal("f_address",rec.address); setVal("f_tel",rec.tel);
    setVal("f_kinyuubi",rec.kinyuubi); setVal("f_kinyuusha",rec.kinyuusha);
    setVal("f_uketsukebi",rec.uketsukebi); setVal("f_yoyakubi",rec.yoyakubi); setVal("f_yoyakuTime",rec.yoyakuTime);
    setVal("f_housoubi",rec.housoubi); setVal("f_housoubi2",rec.housoubi2);
    setVal("f_gishi",rec.gishi); setVal("f_yoyakuNaiyou",rec.yoyakuNaiyou);
    setVal("f_saishu",rec.saishuKakuninsha);
    setVal("f_biko",rec.biko);
    if(rec.method){ const m=document.querySelector(`input[name=method][value="${rec.method}"]`); if(m) m.checked=true; }
    applyChecks($("#sendList"), rec.send||{});
    applyChecks($("#retList"), rec.ret||{});
  } else {
    setVal("f_kinyuubi", new Date().toISOString().slice(0,10));
  }
  $("#formOverlay").classList.add("open");
  $(".modal-box").scrollTop = 0;
}
function setVal(id,v){ const el=$("#"+id); if(el) el.value = v||""; }
function applyChecks(container, data){
  container.querySelectorAll(".check-item").forEach(item=>{
    const key = item.dataset.key;
    if(data[key]) item.classList.add("on");
  });
  container.querySelectorAll(".sub-check").forEach(sc=>{
    if(data[sc.dataset.sub]) sc.classList.add("on");
  });
  container.querySelectorAll(".check-inline-input").forEach(inp=>{
    if(data[inp.dataset.note]!=null) inp.value = data[inp.dataset.note];
  });
}
function collectChecks(container){
  const out = {};
  container.querySelectorAll(".check-item").forEach(item=> out[item.dataset.key] = item.classList.contains("on"));
  container.querySelectorAll(".sub-check").forEach(sc=> out[sc.dataset.sub] = sc.classList.contains("on"));
  container.querySelectorAll(".check-inline-input").forEach(inp=> out[inp.dataset.note] = inp.value.trim());
  return out;
}
function closeForm(){ $("#formOverlay").classList.remove("open"); }

/* ── 保存 ── */
$("#recForm").addEventListener("submit", e=>{
  e.preventDefault();
  const id = $("#f_id").value;
  const methodEl = document.querySelector("input[name=method]:checked");
  const data = {
    name:val("f_name"), kana:val("f_kana"), yoyakuNo:val("f_yoyakuNo"),
    zip:val("f_zip"), address:val("f_address"), tel:val("f_tel"),
    kinyuubi:val("f_kinyuubi"), kinyuusha:val("f_kinyuusha"),
    uketsukebi:val("f_uketsukebi"), yoyakubi:val("f_yoyakubi"), yoyakuTime:val("f_yoyakuTime"),
    housoubi:val("f_housoubi"), housoubi2:val("f_housoubi2"),
    method: methodEl ? methodEl.value : "",
    gishi:val("f_gishi"), yoyakuNaiyou:val("f_yoyakuNaiyou"),
    saishuKakuninsha:val("f_saishu"),
    biko:val("f_biko"),
    send: collectChecks($("#sendList")),
    ret: collectChecks($("#retList")),
    updatedAt: Date.now(),
  };
  if(id){
    const i = records.findIndex(r=>r.id===id);
    records[i] = Object.assign({}, records[i], data);
    toast("保存しました");
  } else {
    data.id = uid(); data.createdAt = Date.now();
    records.unshift(data);
    toast("登録しました");
  }
  persist(); render(); closeForm(); scheduleSync();
});
function val(id){ const el=$("#"+id); return el ? el.value.trim() : ""; }

/* ── 削除 ── */
$("#deleteBtn").addEventListener("click", ()=>{
  const id = $("#f_id").value;
  if(!id) return;
  const rec = records.find(r=>r.id===id);
  if(confirm(`「${rec && rec.name ? rec.name : "この記録"}」を削除しますか？\nこの操作は取り消せません。`)){
    records = records.filter(r=>r.id!==id);
    persist(); render(); closeForm(); scheduleSync(); toast("削除しました");
  }
});

/* ── バックアップ ── */
$("#exportBtn").addEventListener("click", ()=>{
  closeMenu();
  const blob = new Blob([JSON.stringify(records,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `予約送付管理表_バックアップ_${d}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast("バックアップを書き出しました");
});
$("#importBtn").addEventListener("click", ()=>{ closeMenu(); $("#importFile").click(); });
$("#importFile").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error("形式が違います");
      if(!confirm(`${data.length} 件を読み込みます。\n現在のデータに追加しますか？\n（「キャンセル」で中止）`)) return;
      // id重複を避けて追加、既存idは新規idに
      const existing = new Set(records.map(r=>r.id));
      data.forEach(r=>{ if(!r.id || existing.has(r.id)) r.id = uid(); records.push(r); });
      persist(); render(); scheduleSync(); toast(`${data.length} 件を読み込みました`);
    }catch(err){ alert("読み込めませんでした：" + err.message); }
    e.target.value = "";
  };
  reader.readAsText(file);
});

/* ── 郵送物の項目 編集 ── */
function itemRowHtml(id, label){
  return `<div class="item-edit-row" data-id="${esc(id)}">
    <input class="form-input item-edit-label" value="${esc(label)}" placeholder="項目名">
    <button type="button" class="item-del-btn" title="削除">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0v13a1 1 0 01-1 1H7a1 1 0 01-1-1V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>`;
}
function renderItemRows(containerId, list){
  $("#"+containerId).innerHTML = list.map(it=>itemRowHtml(it.id, it.label)).join("");
}
function openItemsEditor(){
  closeMenu();
  renderItemRows("editSendList", itemLists.send);
  renderItemRows("editRetList", itemLists.ret);
  $("#itemsOverlay").classList.add("open");
  $("#itemsOverlay .modal-box").scrollTop = 0;
}
function closeItemsEditor(){ $("#itemsOverlay").classList.remove("open"); }
function readItemRows(containerId){
  const prev = itemLists.send.concat(itemLists.ret);
  const out = [];
  $("#"+containerId).querySelectorAll(".item-edit-row").forEach(r=>{
    const id = r.dataset.id;
    const label = r.querySelector(".item-edit-label").value.trim();
    if(!label) return; // 空の項目は保存しない
    const existing = prev.find(x=>x.id===id);
    out.push(existing ? Object.assign({}, existing, {label}) : {id, label});
  });
  return out;
}
$("#editItemsBtn").addEventListener("click", openItemsEditor);
$("#itemsClose").addEventListener("click", closeItemsEditor);
$("#itemsCancel").addEventListener("click", closeItemsEditor);
document.querySelectorAll(".edit-items-link").forEach(b=> b.addEventListener("click", openItemsEditor));
$("#itemsOverlay").addEventListener("click", e=>{
  const del = e.target.closest(".item-del-btn");
  if(del){ del.closest(".item-edit-row").remove(); return; }
  const add = e.target.closest(".add-item-btn");
  if(add){
    const cid = add.dataset.list==="send" ? "editSendList" : "editRetList";
    $("#"+cid).insertAdjacentHTML("beforeend", itemRowHtml("c_"+uid(), ""));
    const rows = $("#"+cid).querySelectorAll(".item-edit-label");
    rows[rows.length-1].focus();
  }
});
$("#itemsSave").addEventListener("click", ()=>{
  const newSend = readItemRows("editSendList");
  const newRet  = readItemRows("editRetList");
  itemLists = { send:newSend, ret:newRet };
  persistItems(); scheduleSync();
  // 記録フォームが開いていれば、チェック状態を保ったまま作り直す
  if($("#formOverlay").classList.contains("open")){
    const curSend = collectChecks($("#sendList"));
    const curRet  = collectChecks($("#retList"));
    buildChecklist($("#sendList"), itemLists.send);
    buildChecklist($("#retList"), itemLists.ret);
    applyChecks($("#sendList"), curSend);
    applyChecks($("#retList"), curRet);
  }
  closeItemsEditor();
  toast("項目を保存しました");
});

/* ═══════════ スマホと同期（GitHub・カルテと同じ方式）═══════════ */
/* 保存先はカルテと同じ karte-data リポジトリの別ファイル。カルテと同じトークンが使える */
const SYNC_REPO="kamikamigift/karte-data", SYNC_PATH="soufu.enc.json";
let syncCfg=JSON.parse(localStorage.getItem("soufu_sync")||"null");
let syncTimer=null, syncBusy=false, applyingRemote=false, lastRemoteCheck=0, syncGen=0, appReady=false;
function saveSyncCfg(){ localStorage.setItem("soufu_sync", JSON.stringify(syncCfg)); }

function fmtDT(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }

/* base64 <-> バイト列 */
function b64enc(buf){ let s=""; const b=new Uint8Array(buf); for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(str){ const s=atob(str); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; }

/* 合言葉から暗号鍵（PBKDF2 20万回 → AES-GCM 256bit） */
async function deriveKey(pass,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptPayload(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pass,salt);
  const data=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({v:1,salt:b64enc(salt),iv:b64enc(iv),data:b64enc(data)});
}
async function decryptPayload(text,pass){
  const p=JSON.parse(text);
  const key=await deriveKey(pass,b64dec(p.salt));
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64dec(p.iv)},key,b64dec(p.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* GitHub API */
function ghHeaders(){ return {"Authorization":"token "+syncCfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}; }
async function ghGetFileMeta(){
  const res=await fetch(`https://api.github.com/repos/${SYNC_REPO}/contents/?t=${Date.now()}`,{headers:ghHeaders(),cache:"no-store"});
  if(res.status===404) return null;
  if(!res.ok) throw new Error("repo:"+res.status);
  const list=await res.json();
  return Array.isArray(list)?(list.find(f=>f.name===SYNC_PATH)||null):null;
}
async function ghGetFileRaw(){
  const res=await fetch(`https://api.github.com/repos/${SYNC_REPO}/contents/${SYNC_PATH}?t=${Date.now()}`,{headers:{...ghHeaders(),Accept:"application/vnd.github.raw+json"},cache:"no-store"});
  if(res.status===404) return null;
  if(!res.ok) throw new Error("get:"+res.status);
  return res.text();
}
async function ghPutFile(content,sha){
  const body={message:"sync "+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(content)))};
  if(sha) body.sha=sha;
  const res=await fetch(`https://api.github.com/repos/${SYNC_REPO}/contents/${SYNC_PATH}`,{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});
  if(res.status===409||res.status===422) throw Object.assign(new Error("conflict:"+res.status),{conflict:true});
  if(!res.ok) throw new Error("put:"+res.status);
  return (await res.json()).content.sha;
}

/* 保存後に呼ばれる。1.5秒待ってからまとめてアップロード */
function scheduleSync(){
  if(!syncCfg||applyingRemote) return;
  syncGen++; syncCfg.pending=true; saveSyncCfg();
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncUploadSafe,1500);
  renderSyncStatus();
}
function syncErrMsg(e){
  if(/:(401|403)\b/.test(e&&e.message||"")) return "⚠️ 同期できませんでした。トークンの期限切れかもしれません。設定で同期を解除し、新しいトークンで入れ直してください（データはこの端末に残っています）";
  return "⚠️ 同期できませんでした。通信環境を確認してください（データはこの端末に残っています）";
}
async function syncUploadSafe(){
  if(!syncCfg||syncBusy) return;
  syncBusy=true; renderSyncStatus("☁️ 同期中…");
  const gen=syncGen;
  try{ await syncUpload(gen); renderSyncStatus(); }
  catch(e){ console.warn("sync upload failed",e); renderSyncStatus(syncErrMsg(e)); }
  syncBusy=false;
  if(syncGen!==gen) setTimeout(syncUploadSafe,300);
}
async function syncUpload(gen){
  const payload={v:1,exportedAt:new Date().toISOString(),device:syncCfg.deviceName,records,items:itemLists};
  const text=await encryptPayload(payload,syncCfg.pass);
  const finish=sha=>{
    syncCfg.lastSha=sha; syncCfg.lastExportedAt=payload.exportedAt; syncCfg.lastSyncAt=new Date().toISOString();
    if(syncGen===gen) syncCfg.pending=false;
    saveSyncCfg();
  };
  try{ finish(await ghPutFile(text,syncCfg.lastSha||undefined)); }
  catch(e){
    if(!e.conflict) throw e;
    const meta=await ghGetFileMeta();
    const remote=meta?await decryptPayload(await ghGetFileRaw(),syncCfg.pass):null;
    if(remote&&new Date(remote.exportedAt||0)>new Date(syncCfg.lastExportedAt||0)){
      if(confirm(`他の端末で保存された新しいデータが見つかりました（${fmtDT(remote.exportedAt)} 保存）。\n\nOK：新しい方を取り込む（この端末の直近の変更は消えます）\nキャンセル：この端末の内容で上書きする`)){
        await applyRemote(remote,meta.sha); return;
      }
    }
    finish(await ghPutFile(text,meta?meta.sha:undefined));
  }
}
/* 入力・編集の途中は自動取り込みを見送る（丸ごと差し替えで入力が消えるのを防ぐ） */
function isEditingNow(){
  return $("#formOverlay").classList.contains("open")
      || $("#itemsOverlay").classList.contains("open");
}
async function syncCheckRemote(force,manual){
  if(!syncCfg) return;
  if(!manual&&isEditingNow()) return;
  if(!force&&Date.now()-lastRemoteCheck<30000) return;
  lastRemoteCheck=Date.now();
  const meta=await ghGetFileMeta();
  if(!meta){ if(manual) toast("☁️ クラウドにはまだデータがありません"); return; }
  if(meta.sha===syncCfg.lastSha){
    syncCfg.lastSyncAt=new Date().toISOString(); saveSyncCfg(); renderSyncStatus();
    if(manual) toast("☁️ 最新の状態です");
    return;
  }
  const remote=await decryptPayload(await ghGetFileRaw(),syncCfg.pass);
  if(syncCfg.pending){
    const localCount=records.length, cloudCount=(remote.records||[]).length;
    let m=`他の端末で保存された新しいデータがあります（${fmtDT(remote.exportedAt)} 保存）。\n\n`+
          `　この端末：${localCount}件\n　クラウド：${cloudCount}件\n\n`;
    if(cloudCount<localCount) m+=`⚠️ 「取り込む」とこの端末の ${localCount}件 が ${cloudCount}件 に減ります。\n\n`;
    m+=`OK：取り込む（この端末のまだ同期されていない変更は消えます）\nキャンセル：この端末の内容を優先して上書きする`;
    if(!confirm(m)){ await syncUploadSafe(); return; }
  }
  await applyRemote(remote,meta.sha);
}
/* リモートのデータをこの端末に反映 */
async function applyRemote(remote,sha){
  if(!remote||!Array.isArray(remote.records)) throw new Error("bad remote payload");
  applyingRemote=true;
  try{
    records=remote.records;
    if(remote.items&&Array.isArray(remote.items.send)&&Array.isArray(remote.items.ret)) itemLists=remote.items;
    persist(); persistItems();
  }finally{ applyingRemote=false; }
  syncCfg.lastSha=sha; syncCfg.lastExportedAt=remote.exportedAt; syncCfg.pending=false; syncCfg.lastSyncAt=new Date().toISOString();
  saveSyncCfg();
  closeForm(); closeItemsEditor();
  render(); renderSyncStatus();
  toast("☁️ 最新のデータを取り込みました");
}
function detectDeviceName(){
  const ua=navigator.userAgent;
  if(/iPhone/.test(ua)) return "iPhone";
  if(/iPad/.test(ua)) return "iPad";
  if(/Android/.test(ua)) return "Android";
  if(/Mac/.test(ua)) return "Mac";
  return "パソコン";
}
async function setupSync(){
  const token=$("#syncToken").value.trim();
  const pass=$("#syncPass").value;
  if(!token||!pass){ toast("トークンと合言葉の両方を入力してください"); return; }
  if(pass.length<8){ toast("合言葉は8文字以上にしてください"); return; }
  const btn=$("#syncSetupBtn");
  if(btn){ btn.disabled=true; btn.textContent="確認中…"; }
  try{
    syncCfg={token,pass,deviceName:detectDeviceName(),lastSha:null,lastExportedAt:null,pending:false,lastSyncAt:null};
    const meta=await ghGetFileMeta();
    if(meta){
      let remote;
      try{ remote=await decryptPayload(await ghGetFileRaw(),pass); }
      catch(e){
        syncCfg=null;
        alert("クラウドに保存済みのデータがありますが、合言葉が一致しません。\n最初に設定したときと同じ合言葉を入力してください。");
        resetSyncSetupBtn(); return;
      }
      const localCount=records.length, cloudCount=(remote.records||[]).length;
      let msg=`クラウドに保存済みのデータが見つかりました。\n\n`+
              `　この端末（${syncCfg.deviceName}）：${localCount}件\n`+
              `　クラウド：${cloudCount}件（保存 ${fmtDT(remote.exportedAt)}）\n\n`;
      if(cloudCount<localCount){
        msg+=`⚠️ クラウドの方が少ないです。「取り込む」を選ぶと、この端末の ${localCount}件 が ${cloudCount}件 に置き換わり、差の分は消えます。\nこの端末のデータを残したいなら「キャンセル」を選んでください。\n\n`;
      }
      msg+=`OK：クラウドのデータをこの端末に取り込む\nキャンセル：この端末のデータでクラウドを上書きする`;
      if(confirm(msg)){
        if(cloudCount<localCount && !confirm(`本当に取り込みますか？\nこの端末の ${localCount}件 が消えて、クラウドの ${cloudCount}件 に置き換わります。`)){
          syncCfg=null; resetSyncSetupBtn(); return;
        }
        saveSyncCfg(); await applyRemote(remote,meta.sha);
      }else{
        if(!confirm(`この端末（${localCount}件）の内容で、クラウド（${cloudCount}件）を上書きします。よろしいですか？\nクラウド側の以前のデータはこの端末の内容に置き換わります。`)){
          syncCfg=null; resetSyncSetupBtn(); return;
        }
        syncCfg.lastSha=meta.sha; saveSyncCfg(); await syncUploadSafe();
      }
    }else{
      saveSyncCfg(); await syncUploadSafe();
    }
    toast("☁️ 同期を設定しました");
  }catch(e){
    console.warn("sync setup failed",e);
    syncCfg=null;
    alert("同期の設定に失敗しました。\nトークンが正しいか、インターネットに接続しているかを確認してください。");
  }
  resetSyncSetupBtn(); renderSyncPane();
}
function resetSyncSetupBtn(){ const b=$("#syncSetupBtn"); if(b){ b.disabled=false; b.textContent="同期を開始する"; } }
async function syncNow(){
  if(!syncCfg) return;
  try{
    if(syncCfg.pending) await syncUploadSafe();
    await syncCheckRemote(true,true);
  }catch(e){ console.warn(e); renderSyncStatus(syncErrMsg(e)); }
}
function disableSync(){
  if(!confirm("この端末の同期を解除しますか？\n（クラウド上のデータと他の端末には影響しません。データもこの端末に残ります）")) return;
  syncCfg=null; localStorage.removeItem("soufu_sync");
  renderSyncPane(); toast("同期を解除しました");
}
/* 設定モーダルの中身 */
function renderSyncPane(){
  const w=$("#syncPane");
  if(!w) return;
  if(!syncCfg){
    w.innerHTML=`
      <p class="hint" style="font-size:15px;color:var(--text2);font-weight:600;margin-bottom:6px">☁️ パソコンとスマホで同じデータを見る</p>
      <p class="hint" style="margin-bottom:16px">暗号化したデータを非公開の保管庫（GitHub）に自動で預け、もう一方の端末が自動で受け取ります。<strong>両方の端末で同じトークンと合言葉</strong>を入れてください。カルテと同じトークン・合言葉がそのまま使えます。</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:12px">
        <input class="form-input" id="syncToken" type="password" placeholder="アクセストークン（github_pat_… で始まる）" autocomplete="off">
        <input class="form-input" id="syncPass" type="password" placeholder="合言葉（8文字以上・忘れないもの）" autocomplete="off">
        <button class="btn-save" id="syncSetupBtn" style="width:100%">同期を開始する</button>
      </div>
      <p class="hint">💡 合言葉はデータを読み解く鍵です。カルテと同じ合言葉にしておくと覚えやすいです。トークンと合言葉は安全な場所に控えてください。</p>`;
    $("#syncSetupBtn").addEventListener("click", setupSync);
  }else{
    w.innerHTML=`
      <p class="hint" style="font-size:15px;color:var(--text2);font-weight:600;margin-bottom:6px">☁️ 同期</p>
      <p id="syncStatusLine" class="hint" style="margin-bottom:16px"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-save" id="syncNowBtn" style="flex:1;min-width:130px">今すぐ同期</button>
        <button class="btn-cancel" id="syncDisableBtn" style="min-width:150px;flex:1">この端末の同期を解除</button>
      </div>`;
    $("#syncNowBtn").addEventListener("click", syncNow);
    $("#syncDisableBtn").addEventListener("click", disableSync);
    renderSyncStatus();
  }
}
function renderSyncStatus(msg){
  const el=$("#syncStatusLine");
  if(!el||!syncCfg) return;
  el.innerHTML=msg?esc(msg):
    `同期：<strong style="color:#1E8E3E">オン</strong>（この端末：${esc(syncCfg.deviceName||"")}）`+
    `${syncCfg.lastSyncAt?`　最終同期 ${fmtDT(syncCfg.lastSyncAt)}`:""}`+
    `${syncCfg.pending?'　<span style="color:#c2410c">未同期の変更あり</span>':""}`;
}
$("#syncBtn").addEventListener("click", ()=>{ closeMenu(); renderSyncPane(); $("#syncOverlay").classList.add("open"); $("#syncOverlay .modal-box").scrollTop=0; });
$("#syncClose").addEventListener("click", ()=> $("#syncOverlay").classList.remove("open"));
$("#syncOverlay").addEventListener("click", e=>{ if(e.target===$("#syncOverlay")) $("#syncOverlay").classList.remove("open"); });
document.addEventListener("visibilitychange", ()=>{ if(appReady&&document.visibilityState==="visible") syncCheckRemote().catch(()=>{}); });
async function initSyncFlow(){
  if(!syncCfg) return;
  try{ if(syncCfg.pending) await syncUploadSafe(); await syncCheckRemote(true); }
  catch(e){ console.warn("initial sync failed",e); }
}

render();
appReady=true;
initSyncFlow();
</script>
